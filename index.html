<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>[upload]</title>
<style>
    .hero {
    --void: #10070a; --red: #ff2a4d; --ice: #7df9ff; --bone: #f2efe9;
    position: relative; overflow: hidden;
    margin: -28px -28px 24px; padding: 46px 16px 42px;
    background: var(--void); border-radius: 9px 9px 0 0; text-align: center;
  }
  /* scanlines */
  .hero::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(0deg, rgba(255,255,255,.05) 0 1px, transparent 1px 3px);
  }
  /* a red scan bar sweeping down */
  .hero::before {
    content: ""; position: absolute; left: 0; right: 0; top: -4px; height: 2px;
    background: var(--red); opacity: .55; animation: sweep 5s linear infinite;
  }
  .glitch {
    position: relative; display: inline-block; margin: 0; color: var(--bone);
    font: 800 clamp(2.6rem, 12vw, 4.6rem)/1 ui-monospace, "Cascadia Mono", Consolas, "Courier New", monospace;
    letter-spacing: -.03em;
    animation: boot .8s steps(8) both, jolt 4.2s 1s infinite;
  }
  .glitch::before, .glitch::after {
    content: attr(data-text); position: absolute; inset: 0;
    clip-path: inset(0 0 100% 0);
  }
  .glitch::before { color: var(--red); animation: slice-a 4.2s 1s infinite; }
  .glitch::after  { color: var(--ice); animation: slice-b 4.2s 1s infinite; }

  @keyframes boot  { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(-24px); } }
  @keyframes sweep { to { top: 100%; } }
  @keyframes jolt {
    0%, 85%, 100% { transform: none; }
    87% { transform: skewX(-9deg); }
    90% { transform: skewX(7deg) translateX(3px); }
    93% { transform: skewX(-3deg); }
  }
  @keyframes slice-a {
    0%, 85%, 96%, 100% { clip-path: inset(0 0 100% 0); transform: none; }
    86% { clip-path: inset(8% 0 62% 0);  transform: translate(-7px, 0); }
    89% { clip-path: inset(55% 0 22% 0); transform: translate(5px, 0); }
    92% { clip-path: inset(28% 0 46% 0); transform: translate(-5px, 0); }
    94% { clip-path: inset(78% 0 4% 0);  transform: translate(7px, 0); }
  }
  @keyframes slice-b {
    0%, 85%, 96%, 100% { clip-path: inset(0 0 100% 0); transform: none; }
    87% { clip-path: inset(66% 0 12% 0); transform: translate(7px, 0); }
    90% { clip-path: inset(12% 0 70% 0); transform: translate(-6px, 0); }
    93% { clip-path: inset(44% 0 34% 0); transform: translate(6px, 0); }
    95% { clip-path: inset(86% 0 2% 0);  transform: translate(-7px, 0); }
  }
  @media (prefers-reduced-motion: reduce) {
    .hero::before, .glitch { animation: none; }
    .glitch::before, .glitch::after { display: none; }
  }
  :root {
    --paper: #000000;
    --panel: #000000;
    --ink: #ed7474;
    --muted: #a3676a;
    --line: #5c1a1a;
    --accent: #ca3b4c;
    --ok: #1f7a4d;
    --err: #b3261e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
    background: var(--paper); color: var(--ink);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { width: min(520px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 28px; }
  h1 { margin: 0 0 4px; font-size: 1.5rem; letter-spacing: -0.01em; }
  p.sub { margin: 0 0 22px; color: var(--muted); }
  label { display: block; margin: 16px 0 6px; font-weight: 600; font-size: .95rem; }
  input[type=text], input[type=password], textarea {
    width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 6px;
    background: #fff; color: var(--ink); font: inherit;
  }
  textarea { resize: vertical; min-height: 72px; }
  #drop {
    display: block; padding: 28px 16px; text-align: center; cursor: pointer;
    border: 2px dashed var(--line); border-radius: 8px; background: #fff; color: var(--muted);
  }
  #drop.over { border-color: var(--accent); color: var(--accent); }
  #drop input { display: none; }
  ul#list { list-style: none; margin: 10px 0 0; padding: 0; font-size: .9rem; }
  ul#list li { display: flex; justify-content: space-between; gap: 12px; padding: 4px 0; border-bottom: 1px solid var(--line); }
  ul#list span:last-child { color: var(--muted); white-space: nowrap; }
  button {
    margin-top: 22px; width: 100%; padding: 12px; border: 0; border-radius: 6px;
    background: var(--accent); color: #fff; font: inherit; font-weight: 600; cursor: pointer;
  }
  button:disabled { opacity: .55; cursor: default; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  #status { min-height: 1.5em; margin-top: 14px; font-weight: 600; }
  #status.ok { color: var(--ok); }
  #status.err { color: var(--err); }
</style>
</head>
<body>
<main>
    <div class="hero">
      <h1 class="glitch" data-text="[upload]">[upload]</h1>
    </div>
  <h1>Send files to Discord</h1>
  <p class="sub">Files are posted to the channel by the bot. Up to 10 files, 10 MB in total.</p>

  <form id="f">
    <label id="drop" for="files">
      Drop files here or click to choose
      <input id="files" type="file" multiple>
    </label>
    <ul id="list"></ul>

    <label for="msg">Message (optional)</label>
    <textarea id="msg" maxlength="1800"></textarea>

    <label for="key">Upload key</label>
    <input id="key" type="password" autocomplete="current-password">

    <button id="go" type="submit">Upload to Discord</button>
    <div id="status" role="status"></div>
  </form>
</main>

<script>
  // Set this to your deployed Cloudflare Worker URL.
  const WORKER_URL = "https://uplot.matejvascik.workers.dev/";

  const $ = (id) => document.getElementById(id);
  const drop = $("drop"), input = $("files"), list = $("list"), status = $("status"), go = $("go");
  let files = [];

  const size = (n) => n > 1048576 ? (n / 1048576).toFixed(1) + " MB" : Math.max(1, Math.round(n / 1024)) + " KB";

  function render() {
    list.innerHTML = "";
    files.forEach((f) => {
      const li = document.createElement("li");
      const a = document.createElement("span"); a.textContent = f.name;
      const b = document.createElement("span"); b.textContent = size(f.size);
      li.append(a, b); list.append(li);
    });
  }
  function setFiles(fl) { files = [...fl].slice(0, 10); render(); }

  input.addEventListener("change", () => setFiles(input.files));
  ["dragenter", "dragover"].forEach((t) => drop.addEventListener(t, (e) => { e.preventDefault(); drop.classList.add("over"); }));
  ["dragleave", "drop"].forEach((t) => drop.addEventListener(t, (e) => { e.preventDefault(); drop.classList.remove("over"); }));
  drop.addEventListener("drop", (e) => setFiles(e.dataTransfer.files));

  function say(text, cls) { status.textContent = text; status.className = cls || ""; }

  $("f").addEventListener("submit", async (e) => {
    e.preventDefault();
    if (!files.length) return say("Choose at least one file.", "err");
    if (files.reduce((n, f) => n + f.size, 0) > 10 * 1048576) return say("Files exceed 10 MB in total.", "err");

    const fd = new FormData();
    files.forEach((f) => fd.append("files", f, f.name));
    fd.append("message", $("msg").value);

    go.disabled = true; say("Uploading…");
    try {
      const res = await fetch(WORKER_URL, { method: "POST", headers: { "X-Upload-Key": $("key").value }, body: fd });
      const data = await res.json().catch(() => ({}));
      if (res.ok) {
        say("Uploaded to Discord.", "ok");
        files = []; input.value = ""; $("msg").value = ""; render();
      } else {
        say(data.error || "Upload failed (" + res.status + ").", "err");
      }
    } catch {
      say("Couldn’t reach the server. Check WORKER_URL and your connection.", "err");
    } finally {
      go.disabled = false;
    }
  });
</script>
</body>
</html>
